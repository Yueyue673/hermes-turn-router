<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
<title id="title">Large context incident replay</title>
<desc id="desc">v0.3 对同一条 388,493 token 的输入保持 Sol High，没有换成 Luna。缓存风险为 none，v0.2 当时耗时 30.8s。</desc>
<rect width="1400" height="680" fill="#f7f5ec"/>
<g font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'WenQuanYi Micro Hei', sans-serif" fill="#244536">
  <line x1="52" y1="42" x2="1348" y2="42" stroke="#ccd7c6"/>
  <text x="52" y="76" font-size="15" font-weight="600">事故回放 · 2026-08-24</text>
  <text x="1348" y="76" text-anchor="end" font-size="13" fill="#617768">691 条消息的会话</text>

  <text x="52" y="136" font-size="32" font-weight="600">一次被当成简单的请求，并不便宜</text>
  <text x="52" y="172" font-size="16" fill="#617768">把很长的对话换到另一个模型，会丢掉已经能用的缓存边界。</text>

  <g transform="translate(52 212)">
    <rect width="575" height="330" fill="#fffefa" stroke="#ccd7c6"/>
    <rect width="4" height="330" fill="#8d4540"/>
    <text x="24" y="36" font-size="13" fill="#617768">v0.2 · 当时看到的结果</text>
    <text x="24" y="78" font-size="13" fill="#617768">当前 target</text>
    <text x="250" y="78" font-size="16" font-weight="600">Sol · High</text>
    <text x="24" y="116" font-size="13" fill="#617768">改去的 target</text>
    <text x="250" y="116" font-size="16" font-weight="600">Luna · Medium</text>
    <text x="24" y="154" font-size="13" fill="#617768">输入</text>
    <text x="250" y="154" font-size="16" font-weight="600">388,493 tokens</text>
    <text x="24" y="192" font-size="13" fill="#617768">缓存</text>
    <text x="250" y="192" font-size="16" font-weight="600">第一次 Luna 前缀 · 未命中</text>
    <line x1="24" y1="220" x2="551" y2="220" stroke="#e3ebe0"/>
    <text x="24" y="262" font-size="13" fill="#617768">这一轮耗时</text>
    <text x="250" y="268" font-size="32" font-weight="600">30.8s</text>
  </g>

  <g transform="translate(773 212)">
    <rect width="575" height="330" fill="#fffefa" stroke="#ccd7c6"/>
    <rect width="4" height="330" fill="#315e4b"/>
    <text x="24" y="36" font-size="13" fill="#617768">v0.3 · 同一条输入再跑一遍</text>
    <text x="24" y="78" font-size="13" fill="#617768">raw target</text>
    <text x="250" y="78" font-size="16" font-weight="600">fast</text>
    <text x="24" y="116" font-size="13" fill="#617768">context guard</text>
    <text x="250" y="116" font-size="16" font-weight="600">32k+ sticky</text>
    <text x="24" y="154" font-size="13" fill="#617768">最终 target</text>
    <text x="250" y="154" font-size="16" font-weight="600">Sol · High</text>
    <text x="24" y="192" font-size="13" fill="#617768">decision</text>
    <text x="250" y="192" font-size="16" font-weight="600">不切换 · no switch</text>
    <line x1="24" y1="220" x2="551" y2="220" stroke="#e3ebe0"/>
    <text x="24" y="262" font-size="13" fill="#617768">缓存风险</text>
    <text x="250" y="268" font-size="32" font-weight="600" fill="#315e4b">none</text>
  </g>

  <path d="M648 370h104" stroke="#244536" stroke-width="1.25"/>
  <path d="M740 364l12 6-12 6" fill="none" stroke="#244536" stroke-width="1.25"/>

  <line x1="52" y1="586" x2="1348" y2="586" stroke="#ccd7c6"/>
  <text x="52" y="624" font-size="13" fill="#617768">这是决策回放，不是 provider 基准</text>
  <text x="1348" y="624" text-anchor="end" font-size="13" fill="#617768">large_context_sticky · switched=false · cache_risk=none</text>
</g>
</svg>
