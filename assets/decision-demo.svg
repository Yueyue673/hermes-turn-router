<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
<title id="title">Large context incident replay</title>
<desc id="desc">Version 0.3 keeps an established Sol High target instead of moving a 388K uncached prefix to Luna</desc>
<rect width="1400" height="680" fill="#f4f1ea"/>
<g font-family="Inter,Arial,sans-serif" fill="#171717">
  <line x1="52" y1="42" x2="1348" y2="42" stroke="#171717" stroke-width="2"/>
  <text x="52" y="76" font-size="15" font-weight="700">INCIDENT REPLAY / 2026-08-24</text>
  <text x="1348" y="76" text-anchor="end" font-size="15" font-weight="700">691-MESSAGE SESSION</text>

  <text x="52" y="142" font-size="37" font-weight="800" letter-spacing="-1">A “SIMPLE” TURN WASN’T CHEAP.</text>
  <text x="52" y="178" font-size="18">Moving a large conversation to another model discarded the useful cache boundary.</text>

  <g transform="translate(52 220)">
    <rect width="575" height="326" fill="#ebe7de" stroke="#171717" stroke-width="1.5"/>
    <rect width="575" height="48" fill="#ff4d00"/>
    <text x="18" y="31" font-size="14" font-weight="800" fill="#fff">V0.2 / OBSERVED</text>
    <text x="22" y="91" font-size="12" font-weight="700">CURRENT TARGET</text>
    <text x="240" y="91" font-size="18" font-weight="800">SOL · HIGH</text>
    <text x="22" y="134" font-size="12" font-weight="700">ROUTED TARGET</text>
    <text x="240" y="134" font-size="18" font-weight="800">LUNA · MEDIUM</text>
    <text x="22" y="177" font-size="12" font-weight="700">INPUT</text>
    <text x="240" y="177" font-size="18" font-weight="800">388,493 TOKENS</text>
    <text x="22" y="220" font-size="12" font-weight="700">CACHE</text>
    <text x="240" y="220" font-size="18" font-weight="800">FIRST LUNA PREFIX / MISS</text>
    <line x1="22" y1="247" x2="553" y2="247" stroke="#171717"/>
    <text x="22" y="286" font-size="12" font-weight="700">TURN LATENCY</text>
    <text x="240" y="292" font-size="34" font-weight="800">30.8s</text>
  </g>

  <g transform="translate(773 220)">
    <rect width="575" height="326" fill="#ebe7de" stroke="#171717" stroke-width="1.5"/>
    <rect width="575" height="48" fill="#0e7c66"/>
    <text x="18" y="31" font-size="14" font-weight="800" fill="#fff">V0.3 / SAME INPUT REPLAY</text>
    <text x="22" y="91" font-size="12" font-weight="700">RAW TARGET</text>
    <text x="240" y="91" font-size="18" font-weight="800">FAST</text>
    <text x="22" y="134" font-size="12" font-weight="700">CONTEXT GUARD</text>
    <text x="240" y="134" font-size="18" font-weight="800">32K+ STICKY</text>
    <text x="22" y="177" font-size="12" font-weight="700">FINAL TARGET</text>
    <text x="240" y="177" font-size="18" font-weight="800">SOL · HIGH</text>
    <text x="22" y="220" font-size="12" font-weight="700">DECISION</text>
    <text x="240" y="220" font-size="18" font-weight="800">NO SWITCH</text>
    <line x1="22" y1="247" x2="553" y2="247" stroke="#171717"/>
    <text x="22" y="286" font-size="12" font-weight="700">CACHE RISK</text>
    <text x="240" y="292" font-size="34" font-weight="800" fill="#0e7c66">NONE</text>
  </g>

  <path d="M654 378h92" stroke="#171717" stroke-width="3"/>
  <path d="M733 367l13 11-13 11" fill="none" stroke="#171717" stroke-width="3"/>

  <line x1="52" y1="594" x2="1348" y2="594" stroke="#171717" stroke-width="2"/>
  <text x="52" y="629" font-size="12" font-weight="700">DECISION REPLAY, NOT A PROVIDER BENCHMARK</text>
  <text x="1348" y="629" text-anchor="end" font-size="12">LARGE_CONTEXT_STICKY · SWITCHED=FALSE · CACHE_RISK=NONE</text>
</g>
</svg>
