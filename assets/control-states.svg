<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Hermes Turn Router control states</title>
<desc id="desc">桌面控件用圆点、文字和提示一起表示 auto、save、quality、off、检查、旁路、Best once 和离线。</desc>
<rect width="1200" height="430" fill="#f7f5ec"/>
<g font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'WenQuanYi Micro Hei', sans-serif" fill="#244536">
  <line x1="48" y1="36" x2="1152" y2="36" stroke="#ccd7c6"/>
  <text x="48" y="68" font-size="15" font-weight="600">桌面控件</text>
  <text x="1152" y="68" text-anchor="end" font-size="13" fill="#617768">颜色、圆点和文字一起表示</text>

  <text x="48" y="112" font-size="12" fill="#617768">路由模式</text>
  <g transform="translate(48 132)">
    <rect width="264" height="44" fill="#fffefa" stroke="#ccd7c6"/>
    <circle cx="20" cy="22" r="3.5" fill="#315e4b"/>
    <text x="36" y="27" font-size="14" font-weight="600">AUTO · SOL H</text>
  </g>
  <g transform="translate(328 132)">
    <rect width="264" height="44" fill="#fffefa" stroke="#ccd7c6"/>
    <circle cx="20" cy="22" r="3.5" fill="#6d8f78"/>
    <text x="36" y="27" font-size="14" font-weight="600">SAVE · LUNA M</text>
  </g>
  <g transform="translate(608 132)">
    <rect width="264" height="44" fill="#fffefa" stroke="#ccd7c6"/>
    <circle cx="20" cy="22" r="3.5" fill="#b79b4e"/>
    <text x="36" y="27" font-size="14" font-weight="600">QUALITY · SOL ULTRA</text>
  </g>
  <g transform="translate(888 132)">
    <rect width="264" height="44" fill="#fffefa" stroke="#ccd7c6"/>
    <circle cx="20" cy="22" r="3.5" fill="#9aa89f"/>
    <text x="36" y="27" font-size="14" font-weight="600">OFF · NATIVE</text>
    <text x="244" y="27" text-anchor="end" font-size="12" fill="#617768">默认</text>
  </g>

  <text x="48" y="224" font-size="12" fill="#617768">过程、旁路和一次用最好的模型</text>
  <g transform="translate(48 244)">
    <rect width="264" height="44" fill="#fffefa" stroke="#ccd7c6"/>
    <circle cx="20" cy="22" r="3.5" fill="#b79b4e"/>
    <text x="36" y="27" font-size="14" font-weight="600">AUTO · CHECKING</text>
  </g>
  <g transform="translate(328 244)">
    <rect width="264" height="44" fill="#fffefa" stroke="#ccd7c6"/>
    <circle cx="20" cy="22" r="3.5" fill="#b79b4e"/>
    <text x="36" y="27" font-size="14" font-weight="600">AUTO · BYPASS</text>
  </g>
  <g transform="translate(608 244)">
    <rect width="264" height="44" fill="#fffefa" stroke="#ccd7c6"/>
    <circle cx="20" cy="22" r="3.5" fill="#315e4b"/>
    <text x="36" y="27" font-size="14" font-weight="600">BEST · ARMED</text>
  </g>
  <g transform="translate(888 244)">
    <rect width="264" height="44" fill="#fffefa" stroke="#ccd7c6"/>
    <circle cx="20" cy="22" r="3.5" fill="#8d4540"/>
    <text x="36" y="27" font-size="14" font-weight="600">AUTO · OFFLINE</text>
  </g>

  <line x1="48" y1="340" x2="1152" y2="340" stroke="#ccd7c6"/>
  <text x="48" y="378" font-size="14" fill="#617768">日常状态写在控件上，不弹需要关掉的提示，也不挡住对话。</text>
  <text x="48" y="406" font-size="13" fill="#617768">auto 逐轮选择 · save 偏向更省 · quality 偏向更强 · off 交给 Hermes 自己选</text>
</g>
</svg>
