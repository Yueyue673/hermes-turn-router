<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Hermes Turn Router</title>
<desc id="desc">同一条对话按轮选择模型。本地策略提交 target id，Gateway 授权，账本保留这一轮。</desc>
<rect width="1280" height="640" fill="#f7f5ec"/>
<g font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'WenQuanYi Micro Hei', sans-serif" fill="#244536">
  <line x1="72" y1="48" x2="1208" y2="48" stroke="#ccd7c6"/>
  <rect x="72" y="72" width="10" height="10" fill="#315e4b"/>
  <text x="92" y="82" font-size="15" font-weight="600">Hermes Turn Router</text>
  <text x="1208" y="82" text-anchor="end" font-size="13" fill="#617768">逐轮路由 · 缓存边界 · 失败时放行</text>

  <text x="72" y="188" font-size="44" font-weight="600">同一条对话，按轮选模型</text>
  <text x="72" y="232" font-size="18" fill="#617768">每条消息一个已授权的 target。本地策略提出意图，Gateway 决定能否执行。</text>

  <line x1="72" y1="268" x2="1208" y2="268" stroke="#ccd7c6"/>
  <text x="72" y="312" font-size="16">“Hello”</text>
  <text x="1208" y="312" text-anchor="end" font-size="16" font-weight="600">Luna · Medium</text>
  <line x1="72" y1="332" x2="1208" y2="332" stroke="#e3ebe0"/>
  <text x="72" y="376" font-size="16">“Review the API root cause”</text>
  <text x="1208" y="376" text-anchor="end" font-size="16" font-weight="600">Sol · Medium</text>
  <line x1="72" y1="396" x2="1208" y2="396" stroke="#e3ebe0"/>
  <text x="72" y="440" font-size="16">“Use the best model”</text>
  <text x="1208" y="440" text-anchor="end" font-size="16" font-weight="600">Sol · Ultra</text>
  <line x1="72" y1="460" x2="1208" y2="460" stroke="#e3ebe0"/>
  <text x="72" y="504" font-size="16">“Shorten this title”</text>
  <text x="360" y="504" font-size="13" fill="#315e4b">36 万 token · 缓存边界保持</text>
  <text x="1208" y="504" text-anchor="end" font-size="16" font-weight="600">Sol · High</text>

  <line x1="72" y1="556" x2="1208" y2="556" stroke="#ccd7c6"/>
  <text x="72" y="596" font-size="14" fill="#617768">不做分类请求</text>
  <text x="230" y="596" font-size="14" fill="#617768">客户端不能改模型</text>
  <text x="430" y="596" font-size="14" fill="#617768">旁路可见</text>
  <text x="1208" y="596" text-anchor="end" font-size="14" fill="#617768">Yueyue673</text>
</g>
</svg>
