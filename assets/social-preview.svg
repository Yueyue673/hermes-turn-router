    <g transform="translate(220 72)"><rect width="198" height="42" rx="6" fill="#2a2110" stroke="#eab54a"/><circle cx="20" cy="21" r="5" fill="#f6bd4e"/><text x="36" y="27" font-size="14" font-weight="800" fill="#f5c96c">BEST · ARMED</text></g>

