<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">Hermes Turn Router</title>
<desc id="desc">One conversation routed turn by turn with visible Composer state</desc>
<rect width="1400" height="620" fill="#111214"/>
<g font-family="Inter,Arial,sans-serif">
  <line x1="54" y1="42" x2="1346" y2="42" stroke="#40434a"/>
  <rect x="56" y="63" width="9" height="9" fill="#8296ff"/><rect x="69" y="63" width="9" height="9" fill="#36d399"/><rect x="82" y="63" width="9" height="9" fill="#f6bd4e"/><rect x="95" y="63" width="9" height="9" fill="#ee6670"/>
  <text x="120" y="73" font-size="14" font-weight="800" fill="#f4f1ea">HERMES / TURN ROUTER</text>
  <text x="1344" y="73" text-anchor="end" font-size="13" font-weight="700" fill="#8d9199">PER-TURN · CACHE-AWARE · FAIL-OPEN</text>

  <text x="54" y="178" font-size="67" font-weight="800" letter-spacing="-3" fill="#f4f1ea">ONE THREAD.</text>
  <text x="54" y="248" font-size="67" font-weight="800" letter-spacing="-3" fill="#f4f1ea">RIGHT MODEL,</text>
  <text x="54" y="318" font-size="67" font-weight="800" letter-spacing="-3" fill="#f4f1ea">TURN BY TURN.</text>

  <text x="56" y="376" font-size="16" font-weight="700" fill="#a8abb2">LOCAL POLICY</text>
  <line x1="56" y1="390" x2="184" y2="390" stroke="#8296ff" stroke-width="3"/>
  <text x="216" y="376" font-size="16" font-weight="700" fill="#a8abb2">SERVER AUTHORITY</text>
  <line x1="216" y1="390" x2="384" y2="390" stroke="#36d399" stroke-width="3"/>
  <text x="416" y="376" font-size="16" font-weight="700" fill="#a8abb2">DURABLE TURN</text>
  <line x1="416" y1="390" x2="554" y2="390" stroke="#f6bd4e" stroke-width="3"/>

  <text x="56" y="452" font-size="21" fill="#d6d4cf">Every message gets one authorized target.</text>
  <text x="56" y="484" font-size="21" fill="#d6d4cf">Queue, retry, and restart keep that decision.</text>

  <g transform="translate(716 112)">
    <rect width="630" height="408" rx="10" fill="#17181b" stroke="#44474e"/>
    <line x1="0" y1="52" x2="630" y2="52" stroke="#34373d"/>
    <circle cx="24" cy="26" r="4" fill="#6f737b"/><circle cx="40" cy="26" r="4" fill="#6f737b"/><circle cx="56" cy="26" r="4" fill="#6f737b"/>
    <text x="82" y="31" font-size="12" font-weight="700" fill="#8d9199">LIVE COMPOSER STATE</text>
    <text x="606" y="31" text-anchor="end" font-size="12" font-weight="700" fill="#8d9199">ONE MODEL / TURN</text>

    <g transform="translate(20 73)">
      <rect width="590" height="62" rx="6" fill="#1d1f23"/>
      <text x="18" y="24" font-size="11" font-weight="700" fill="#71757d">01 · SIMPLE</text>
      <text x="18" y="46" font-size="16" font-weight="700" fill="#e8e5df">“Hello”</text>
      <g transform="translate(410 12)"><rect width="162" height="38" rx="6" fill="#18213a" stroke="#637dff"/><circle cx="18" cy="19" r="4" fill="#8296ff"/><text x="31" y="24" font-size="13" font-weight="800" fill="#aebaff">AUTO · LUNA M</text></g>
    </g>
    <g transform="translate(20 145)">
      <rect width="590" height="62" rx="6" fill="#1d1f23"/>
      <text x="18" y="24" font-size="11" font-weight="700" fill="#71757d">02 · TECHNICAL</text>
      <text x="18" y="46" font-size="16" font-weight="700" fill="#e8e5df">“Review the API root cause”</text>
      <g transform="translate(420 12)"><rect width="152" height="38" rx="6" fill="#18213a" stroke="#637dff"/><circle cx="18" cy="19" r="4" fill="#8296ff"/><text x="31" y="24" font-size="13" font-weight="800" fill="#aebaff">AUTO · SOL M</text></g>
    </g>
    <g transform="translate(20 217)">
      <rect width="590" height="62" rx="6" fill="#1d1f23"/>
      <text x="18" y="24" font-size="11" font-weight="700" fill="#71757d">03 · FINAL REVIEW</text>
      <text x="18" y="46" font-size="16" font-weight="700" fill="#e8e5df">“Use the best model”</text>
      <g transform="translate(370 12)"><rect width="202" height="38" rx="6" fill="#2a2110" stroke="#eab54a"/><circle cx="18" cy="19" r="4" fill="#f6bd4e"/><text x="31" y="24" font-size="13" font-weight="800" fill="#f5c96c">QUALITY · SOL ULTRA</text></g>
    </g>
    <g transform="translate(20 289)">
      <rect width="590" height="78" rx="6" fill="#1d1f23"/>
      <text x="18" y="24" font-size="11" font-weight="700" fill="#71757d">04 · 360K CONTEXT</text>
      <text x="18" y="49" font-size="16" font-weight="700" fill="#e8e5df">“Shorten this title”</text>
      <text x="18" y="68" font-size="10" font-weight="700" fill="#36d399">CACHE AFFINITY HELD</text>
      <g transform="translate(420 20)"><rect width="152" height="38" rx="6" fill="#18213a" stroke="#637dff"/><circle cx="18" cy="19" r="4" fill="#8296ff"/><text x="31" y="24" font-size="13" font-weight="800" fill="#aebaff">AUTO · SOL H</text></g>
    </g>
  </g>

  <line x1="54" y1="560" x2="1346" y2="560" stroke="#40434a"/>
  <text x="54" y="592" font-size="12" fill="#8d9199">NO CLASSIFIER CALL</text>
  <text x="242" y="592" font-size="12" fill="#8d9199">NO CLIENT MODEL OVERRIDE</text>
  <text x="505" y="592" font-size="12" fill="#8d9199">VISIBLE BYPASS</text>
  <text x="1346" y="592" text-anchor="end" font-size="12" fill="#8d9199">GITHUB.COM/YUEYUE673/HERMES-TURN-ROUTER</text>
</g>
</svg>
