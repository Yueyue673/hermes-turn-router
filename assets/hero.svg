<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">Hermes Turn Router</title>
<desc id="desc">同一条对话按轮选择模型。每条消息对应一个已授权的 target，队列、重试和重启都保留这个决定。</desc>
<rect width="1400" height="620" fill="#f7f5ec"/>
<g font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'WenQuanYi Micro Hei', sans-serif" fill="#244536">
  <line x1="56" y1="40" x2="1344" y2="40" stroke="#ccd7c6"/>
  <rect x="56" y="58" width="10" height="10" fill="#315e4b"/>
  <text x="76" y="68" font-size="15" font-weight="600">Hermes Turn Router</text>
  <text x="1344" y="68" text-anchor="end" font-size="13" fill="#617768">逐轮路由 · 本地策略 · 服务端授权</text>

  <text x="56" y="168" font-size="40" font-weight="600">同一条对话，按轮选模型</text>
  <text x="56" y="214" font-size="18" fill="#617768">每条消息只得到一个已授权的 target。</text>
  <text x="56" y="244" font-size="18" fill="#617768">队列、重试和重启都保留这个决定。</text>

  <text x="56" y="312" font-size="13" fill="#617768">本地策略</text>
  <text x="56" y="338" font-size="16" font-weight="600">只提交 target id</text>
  <text x="248" y="312" font-size="13" fill="#617768">服务端授权</text>
  <text x="248" y="338" font-size="16" font-weight="600">Gateway 决定能否执行</text>
  <text x="500" y="312" font-size="13" fill="#617768">这一轮的记录</text>
  <text x="500" y="338" font-size="16" font-weight="600">SQLite 账本</text>

  <rect x="760" y="112" width="584" height="404" fill="#fffefa" stroke="#ccd7c6"/>
  <text x="784" y="148" font-size="13" fill="#617768">Composer 里能看见的结果</text>
  <text x="1320" y="148" text-anchor="end" font-size="13" fill="#617768">一轮一个模型</text>
  <line x1="784" y1="166" x2="1320" y2="166" stroke="#ccd7c6"/>

  <text x="784" y="200" font-size="12" fill="#617768">01 · 简单请求 · simple_request</text>
  <text x="784" y="228" font-size="16" font-weight="600">“Hello”</text>
  <text x="1320" y="228" text-anchor="end" font-size="15" font-weight="600">Luna · Medium</text>
  <line x1="784" y1="248" x2="1320" y2="248" stroke="#e3ebe0"/>

  <text x="784" y="282" font-size="12" fill="#617768">02 · 技术问题 · complex_reasoning</text>
  <text x="784" y="310" font-size="16" font-weight="600">“Review the API root cause”</text>
  <text x="1320" y="310" text-anchor="end" font-size="15" font-weight="600">Sol · Medium</text>
  <line x1="784" y1="330" x2="1320" y2="330" stroke="#e3ebe0"/>

  <text x="784" y="364" font-size="12" fill="#617768">03 · 明确要求更好的模型 · explicit_quality</text>
  <text x="784" y="392" font-size="16" font-weight="600">“Use the best model”</text>
  <text x="1320" y="392" text-anchor="end" font-size="15" font-weight="600">Sol · Ultra</text>
  <line x1="784" y1="412" x2="1320" y2="412" stroke="#e3ebe0"/>

  <text x="784" y="446" font-size="12" fill="#617768">04 · 36 万 token · large_context_sticky</text>
  <text x="784" y="474" font-size="16" font-weight="600">“Shorten this title”</text>
  <text x="1320" y="474" text-anchor="end" font-size="15" font-weight="600">Sol · High</text>
  <text x="784" y="496" font-size="12" fill="#315e4b">缓存边界保持，没有换成更快的模型</text>

  <line x1="56" y1="552" x2="1344" y2="552" stroke="#ccd7c6"/>
  <text x="56" y="586" font-size="13" fill="#617768">不做分类请求</text>
  <text x="210" y="586" font-size="13" fill="#617768">客户端不能改模型</text>
  <text x="400" y="586" font-size="13" fill="#617768">旁路可见</text>
  <text x="1344" y="586" text-anchor="end" font-size="13" fill="#617768">github.com/Yueyue673/hermes-turn-router</text>
</g>
</svg>
