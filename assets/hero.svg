<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">Hermes Turn Router</title>
<desc id="desc">Cache-stable per-turn model routing for Hermes Agent</desc>
<rect width="1400" height="620" fill="#f4f1ea"/>
<g font-family="Inter,Arial,sans-serif" fill="#171717">
  <line x1="56" y1="44" x2="1344" y2="44" stroke="#171717" stroke-width="2"/>
  <text x="56" y="79" font-size="15" font-weight="700">HERMES / TURN TRANSACTION ROUTER</text>
  <text x="1344" y="79" text-anchor="end" font-size="15" font-weight="700">V0.3 · MIT</text>

  <text x="56" y="184" font-size="78" font-weight="800" letter-spacing="-4">THE RIGHT MODEL.</text>
  <text x="56" y="262" font-size="78" font-weight="800" letter-spacing="-4">WITHOUT LOSING</text>
  <text x="56" y="340" font-size="78" font-weight="800" letter-spacing="-4">THE CACHE.</text>

  <rect x="58" y="382" width="16" height="16" fill="#ff4d00"/>
  <text x="88" y="397" font-size="17" font-weight="700">LOCAL POLICY · SERVER AUTHORITY · DURABLE TURN LEDGER</text>
  <text x="56" y="460" font-size="23">One message enters. One authorized target leaves.</text>
  <text x="56" y="491" font-size="23">Queue, retry, and restart keep the same decision.</text>

  <g transform="translate(900 126)">
    <text x="0" y="0" font-size="13" font-weight="700">REFERENCE TARGET LADDER</text>
    <line x1="0" y1="28" x2="430" y2="28" stroke="#171717"/>

    <g transform="translate(0 54)">
      <rect width="430" height="68" fill="#ebe7de" stroke="#171717" stroke-width="1.5"/>
      <text x="20" y="27" font-size="12" font-weight="700">FAST</text>
      <text x="20" y="51" font-size="21" font-weight="800">LUNA · MEDIUM</text>
      <text x="408" y="41" text-anchor="end" font-size="13">&lt; 25</text>
    </g>
    <g transform="translate(0 132)">
      <rect width="430" height="68" fill="#ebe7de" stroke="#171717" stroke-width="1.5"/>
      <text x="20" y="27" font-size="12" font-weight="700">BALANCED</text>
      <text x="20" y="51" font-size="21" font-weight="800">SOL · MEDIUM</text>
      <text x="408" y="41" text-anchor="end" font-size="13">25—59</text>
    </g>
    <g transform="translate(0 210)">
      <rect width="430" height="68" fill="#0e7c66" stroke="#171717" stroke-width="1.5"/>
      <text x="20" y="27" font-size="12" font-weight="700" fill="#fff">STRONG</text>
      <text x="20" y="51" font-size="21" font-weight="800" fill="#fff">SOL · HIGH</text>
      <text x="408" y="41" text-anchor="end" font-size="13" fill="#fff">60—89</text>
    </g>
    <g transform="translate(0 288)">
      <rect width="430" height="68" fill="#ff4d00" stroke="#171717" stroke-width="1.5"/>
      <text x="20" y="27" font-size="12" font-weight="700" fill="#fff">PREMIUM</text>
      <text x="20" y="51" font-size="21" font-weight="800" fill="#fff">SOL · XHIGH</text>
      <text x="408" y="41" text-anchor="end" font-size="13" fill="#fff">90+</text>
    </g>
    <text x="0" y="390" font-size="12" font-weight="700">32K+ CONTEXT → HOLD ESTABLISHED TARGET</text>
  </g>

  <line x1="56" y1="566" x2="1344" y2="566" stroke="#171717" stroke-width="2"/>
  <text x="56" y="596" font-size="12">NO CLASSIFIER CALL</text>
  <text x="252" y="596" font-size="12">NO CLIENT MODEL OVERRIDE</text>
  <text x="510" y="596" font-size="12">FAIL-OPEN SENDS</text>
  <text x="1344" y="596" text-anchor="end" font-size="12">GITHUB.COM/YUEYUE673/HERMES-TURN-ROUTER</text>
</g>
</svg>
